<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nacionalidade</title>
</head>
<body>
    <h1>Sistema de Nacionalidade</h1>
    Em que país você está vivendo? <input type="text" name="pais" id="txtpais">
    <input type="button" value="Enviar" onclick="verificar()">
    <div id="res">

    </div>
    <script>
        function verificar() {
            var txtpais = window.document.querySelector('input#txtpais')
            var res = window.document.querySelector('div#res')
            var pais = String(txtpais.value).trim()
            res.innerHTML = `<p>Você está vivendo no <strong>${pais}</strong>.</p>`
            if (pais.toUpperCase() === 'BRASIL') {
                res.innerHTML += `<p>Portanto você é brasileiro(a).</p>`
            } else {
                res.innerHTML += '<p>Portanto você é estrangeiro(a).</p>'
            }
        }
    </script>
</body>
</html>
